modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
logoFile = "logo.png"
authors = "Izakji"
description = '''
${description}
'''

[[mixins]]
config = "mccreatorutils.mixins.json"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[${neo_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "ldlib2"
type = "required"
versionRange = "[${ldlib2_version},)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.${mod_id}]]
modId = "rinku"
type = "optional"
versionRange = "[3.0.4,)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.${mod_id}]]
modId = "cmdcam"
type = "optional"
versionRange = "[2.0.0,)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.${mod_id}]]
modId = "creativecore"
type = "optional"
versionRange = "[2.13.32,)"
ordering = "NONE"
side = "CLIENT"
