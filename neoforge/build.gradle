plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev'
}

base {
    archivesName = mod_id
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            ideName.set('Client')
            ideFolderName.set('NeoForge')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            ideName.set('Server')
            ideFolderName.set('NeoForge')
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            ideName.set('Data')
            ideFolderName.set('NeoForge')
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').absolutePath,
                    '--existing', file('src/main/resources/').absolutePath,
                    '--existing', rootProject.file('common/src/main/resources/').absolutePath
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

repositories {
    maven {
        name = 'FirstDark Snapshots'
        url = uri('https://maven.firstdark.dev/snapshots')
    }
    maven {
        name = 'MinecraftForge'
        url = uri('https://maven.minecraftforge.net/')
    }
    maven {
        name = 'Keksuccino'
        url = uri('https://keksuccino.github.io/maven/')
    }
}

configurations {
    commonJava { canBeResolved = true }
    commonResources { canBeResolved = true }
    rinkuDist {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
}

dependencies {
    implementation "com.lowdragmc.ldlib2:ldlib2-neoforge-${minecraft_version}:${ldlib2_version}:all"
    compileOnly "com.github.glitchfiend:TerraBlender-neoforge:${terrablender_version}"
    implementation "de.keksuccino:rinku-neoforge:${rinku_version}"
    rinkuDist "de.keksuccino:rinku-neoforge:${rinku_version}"

    commonJava project(path: ':common', configuration: 'commonJava')
    commonResources project(path: ':common', configuration: 'commonResources')
}

def rinkuModJar = layout.buildDirectory.file('rinku/rinku-mod.jar')
def extractRinkuMod = tasks.register('extractRinkuMod', Copy) {
    inputs.files(configurations.rinkuDist)
    from({ zipTree(configurations.rinkuDist.singleFile) }) {
        include 'META-INF/jarjar/*-mod.jar'
        eachFile { details -> details.path = 'rinku-mod.jar' }
        includeEmptyDirs = false
    }
    into(layout.buildDirectory.dir('rinku'))
}

dependencies {
    compileOnly files(rinkuModJar)
}

tasks.named('compileJava', JavaCompile) {
    dependsOn extractRinkuMod
}

tasks.named('compileJava', JavaCompile) {
    dependsOn(configurations.commonJava)
    source(configurations.commonJava)
}

processResources {
    dependsOn(configurations.commonResources)
    from(configurations.commonResources)
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            description            : mod_description,
            ldlib2_version         : ldlib2_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${rootProject.projectDir}/repo"
        }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
